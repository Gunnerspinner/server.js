<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Clicker Simulator</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --accent-hover: #0ea5e9;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            user-select: none;
            overflow-x: hidden;
        }

        .game-container {
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 30px;
            max-width: 1050px;
            width: 100%;
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        @media (max-width: 900px) {
            .game-container {
                grid-template-columns: 1fr;
            }
        }

        .click-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-right: 1px solid #334155;
            padding-right: 15px;
        }

        @media (max-width: 900px) {
            .click-section {
                border-right: none;
                border-bottom: 1px solid #334155;
                padding-right: 0;
                padding-bottom: 30px;
            }
        }

        .score-display {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--accent-color);
            margin-bottom: 5px;
            text-align: center;
        }

        .stats-display {
            font-size: 1rem;
            color: var(--text-muted);
            margin-bottom: 30px;
            text-align: center;
            line-height: 1.4;
        }

        .click-btn {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-color), #2563eb);
            border: 8px solid #0284c7;
            cursor: pointer;
            outline: none;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
            transition: transform 0.1s ease, box-shadow 0.1s ease;
            position: relative;
        }

        .click-btn:active {
            transform: scale(0.92);
            box-shadow: 0 0 35px rgba(56, 189, 248, 0.8), inset 0 0 20px rgba(255, 255, 255, 0.4);
        }

        .upgrades-section {
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-height: 70vh;
            overflow-y: auto;
            padding-right: 10px;
        }

        /* Scrollbar styles */
        .upgrades-section::-webkit-scrollbar {
            width: 6px;
        }
        .upgrades-section::-webkit-scrollbar-track {
            background: #0f172a;
            border-radius: 10px;
        }
        .upgrades-section::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 10px;
        }

        .category-title {
            font-size: 1.2rem;
            margin: 10px 0 5px 0;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .upgrade-card {
            background-color: #0f172a;
            padding: 15px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #334155;
            transition: border-color 0.2s;
            margin-bottom: 8px;
        }

        .upgrade-card:hover {
            border-color: var(--accent-color);
        }

        .upgrade-info h3 {
            margin: 0 0 5px 0;
            font-size: 1.1rem;
        }

        .upgrade-info p {
            margin: 0;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .buy-btn {
            background-color: var(--accent-color);
            color: #0f172a;
            border: none;
            padding: 10px 15px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s, opacity 0.2s;
            min-width: 100px;
        }

        .buy-btn:hover {
            background-color: var(--accent-hover);
        }

        .buy-btn:disabled {
            background-color: #475569;
            color: #94a3b8;
            cursor: not-allowed;
        }

        .utility-buttons {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

        .util-btn {
            background: none;
            border: 1px solid #475569;
            color: var(--text-muted);
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .util-btn:hover {
            color: #ef4444;
            border-color: #ef4444;
        }

        .floating-text {
            position: fixed;
            color: #ffffff;
            font-weight: 800;
            font-size: 1.75rem;
            text-shadow: 0 0 8px rgba(56, 189, 248, 0.8), 0 0 15px rgba(37, 99, 235, 0.5);
            pointer-events: none;
            z-index: 9999;
            animation: floatUpAndFade 0.6s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards;
        }

        @keyframes floatUpAndFade {
            0% { opacity: 1; transform: translate(-50%, -50%) scale(0.6) translateY(0); }
            50% { opacity: 1; transform: translate(-50%, -50%) scale(1.1) translateY(-40px); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(0.9) translateY(-100px); }
        }
    </style>
</head>
<body>

    <div class="game-container">
        <!-- LEFT: Clicking Zone -->
        <div class="click-section">
            <div class="score-display" id="score">0 Credits</div>
            <div class="stats-display">
                <span id="pps-display">0 per second</span><br>
                <small id="pc-display">Click Power: +1</small>
            </div>
            
            <button class="click-btn" id="click-target"></button>

            <div class="utility-buttons">
                <button class="util-btn" id="reset-btn">Reset Progress</button>
            </div>
        </div>

        <!-- RIGHT: Upgrades Zone -->
        <div class="upgrades-section" id="upgrades-list">
            <!-- Content will be auto-generated by JavaScript -->
        </div>
    </div>

    <script>
        // --- GAME STATE & EXPANDED CONFIG ---
        let game = {
            credits: 0,
            clickPower: 1,
            pointsPerSec: 0,
            upgrades: {
                // ACTIVE CLICK UPGRADES
                pointer: { lvl: 0, baseCost: 10, costMult: 1.4, value: 1, type: 'click', name: 'Enhanced Pointer', desc: 'Adds +1 per manual click' },
                keyboard: { lvl: 0, baseCost: 150, costMult: 1.45, value: 5, type: 'click', name: 'Macro Keyboard', desc: 'Adds +5 per manual click' },
                neuro: { lvl: 0, baseCost: 1200, costMult: 1.5, value: 40, type: 'click', name: 'Neural Link', desc: 'Adds +40 per manual click' },
                quantum_click: { lvl: 0, baseCost: 15000, costMult: 1.6, value: 350, type: 'click', name: 'Quantum Overclock', desc: 'Adds +350 per manual click' },
                
                // IDLE UPGRADES
                bot: { lvl: 0, baseCost: 50, costMult: 1.3, value: 1, type: 'idle', name: 'Click Bot', desc: 'Generates +1 credit/sec' },
                drone: { lvl: 0, baseCost: 400, costMult: 1.35, value: 8, type: 'idle', name: 'Mining Drone', desc: 'Generates +8 credits/sec' },
                server: { lvl: 0, baseCost: 3000, costMult: 1.4, value: 60, type: 'idle', name: 'Data Center', desc: 'Generates +60 credits/sec' },
                matrix: { lvl: 0, baseCost: 25000, costMult: 1.45, value: 500, type: 'idle', name: 'The Matrix Node', desc: 'Generates +500 credits/sec' },
                antimatter: { lvl: 0, baseCost: 200000, costMult: 1.5, value: 4500, type: 'idle', name: 'Antimatter Engine', desc: 'Generates +4500 credits/sec' }
            }
        };

        const scoreEl = document.getElementById('score');
        const ppsEl = document.getElementById('pps-display');
        const pcEl = document.getElementById('pc-display');
        const clickTarget = document.getElementById('click-target');
        const upgradesListEl = document.getElementById('upgrades-list');
        const resetBtn = document.getElementById('reset-btn');

        // --- CALCULATE COSTS AND STATS ---
        function getCost(upgradeKey) {
            const upg = game.upgrades[upgradeKey];
            return Math.floor(upg.baseCost * Math.pow(upg.costMult, upg.lvl));
        }

        function recalculateTotals() {
            let cp = 1;
            let pps = 0;

            for (const key in game.upgrades) {
                const upg = game.upgrades[key];
                if (upg.type === 'click') {
                    cp += upg.lvl * upg.value;
                } else if (upg.type === 'idle') {
                    pps += upg.lvl * upg.value;
                }
            }

            game.clickPower = cp;
            game.pointsPerSec = pps;
        }

        // --- GENERATE UPGRADE INTERFACE DYNAMICALLY ---
        function renderUpgradeList() {
            upgradesListEl.innerHTML = '';
            
            // Render Active Upgrades First
Use code with caution.
const clickHeader = document.createElement('h2');
clickHeader.className = 'category-title';
clickHeader.textContent = 'Active Matrix (Manual Click)';
upgradesListEl.appendChild(clickHeader);
for (const key in game.upgrades) {
if (game.upgrades[key].type === 'click') createCard(key);
}
// Render Idle Upgrades Second
const idleHeader = document.createElement('h2');
idleHeader.className = 'category-title';
idleHeader.textContent = 'Automation Subsystem (Idle)';
upgradesListEl.appendChild(idleHeader);
for (const key in game.upgrades) {
if (game.upgrades[key].type === 'idle') createCard(key);
}
}
function createCard(key) {
const upg = game.upgrades[key];
const currentCost = getCost(key);
const card = document.createElement('div');
card.className = 'upgrade-card';
card.id = card-${key};
card.innerHTML = <div class="upgrade-info"> <h3>${upg.name}</h3> <p>${upg.desc}</p> <p class="cost-text" id="cost-${key}">Cost: ${currentCost}</p> </div> <button class="buy-btn" id="btn-${key}" onclick="buyUpgrade('${key}')"> Buy (<span id="lvl-${key}">${upg.lvl}</span>) </button>;
upgradesListEl.appendChild(card);
}
// --- LOCAL STORAGE ---
function saveGame() {
localStorage.setItem('cyberClickerSaveExpanded', JSON.stringify(game));
}
function loadGame() {
const saved = localStorage.getItem('cyberClickerSaveExpanded');
if (saved) {
const parsed = JSON.parse(saved);
// Ensure structural integrity if upgrades are added/changed in future
if (parsed.upgrades) {
for (const key in parsed.upgrades) {
if (game.upgrades[key]) {
game.upgrades[key].lvl = parsed.upgrades[key].lvl;
}
}
}
game.credits = parsed.credits || 0;
recalculateTotals();
}
}
// --- UI REFRESH LOOP ---
function updateUI() {
scoreEl.textContent = ${Math.floor(game.credits)} Credits;
ppsEl.textContent = ${game.pointsPerSec.toFixed(1)} per second;
pcEl.textContent = Click Power: +${game.clickPower};
for (const key in game.upgrades) {
const cost = getCost(key);
const btn = document.getElementById(btn-${key});
const costText = document.getElementById(cost-${key});
const lvlText = document.getElementById(lvl-${key});
if (btn && costText && lvlText) {
costText.textContent = Cost: ${cost};
lvlText.textContent = game.upgrades[key].lvl;
btn.disabled = game.credits < cost;
}
}
}
// --- BURST TEXT MECHANIC ---
function createFloatingText(e) {
let x, y;
if (e.clientX && e.clientY) {
x = e.clientX;
y = e.clientY;
} else {
const rect = clickTarget.getBoundingClientRect();
x = rect.left + (rect.width / 2);
y = rect.top + (rect.height / 2);
}
const floating = document.createElement('div');
floating.className = 'floating-text';
floating.textContent = +${game.clickPower};
floating.style.left = ${x}px;
floating.style.top = ${y}px;
document.body.appendChild(floating);
setTimeout(() => floating.remove(), 600);
}
// --- GAME ACTIONS ---
clickTarget.addEventListener('click', (e) => {
game.credits += game.clickPower;
createFloatingText(e);
updateUI();
});
window.buyUpgrade = function(key) {
const cost = getCost(key);
if (game.credits >= cost) {
game.credits -= cost;
game.upgrades[key].lvl++;
recalculateTotals();
updateUI();
saveGame();
}
};
resetBtn.addEventListener('click', () => {
if (confirm("Are you sure you want to completely wipe all infrastructure data?")) {
localStorage.removeItem('cyberClickerSaveExpanded');
location.reload();
}
});
// --- TIME LOOPS ---
setInterval(() => {
if (game.pointsPerSec > 0) {
game.credits += (game.pointsPerSec / 10);
updateUI();
} else {
// Ensure continuous updates even if passive flow is 0
updateUI();
}
}, 100);
setInterval(saveGame, 15000);
// INITIALIZE
loadGame();
renderUpgradeList();
updateUI();
